<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dodge Designed This — Admin Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0a0a0a; --paper:#ffffff; --grey:#eeeeee; --mid:#9a9a9a; }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--grey); color:var(--ink); font-family:'Oswald',sans-serif; letter-spacing:0.3px;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:900px; margin:0 auto; padding:0 24px;}

  header{background:#000; border-bottom:2px solid #000;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 0; flex-wrap:wrap; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{height:38px;}
  .brand .tag{color:#fff; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase;}
  nav{display:flex; gap:22px; flex-wrap:wrap;}
  nav a{font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#bbb; border-bottom:2px solid transparent; padding-bottom:2px;}
  nav a.current{color:#fff; border-color:#fff;}
  nav a:hover{color:#fff;}
  .signout{font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#bbb; border:1px solid #444; padding:6px 12px; background:none; cursor:pointer; font-family:'Oswald',sans-serif;}
  .signout:hover{color:#fff; border-color:#888;}

  main{padding:40px 0 60px;}
  h1{font-size:26px; text-transform:uppercase; letter-spacing:0.5px; margin:0 0 10px;}
  .subtitle{font-size:13px; color:var(--mid); text-transform:none; letter-spacing:0; margin:0 0 28px; max-width:560px; line-height:1.6;}

  .card{background:#fff; border:2px solid var(--ink); padding:24px; margin-bottom:20px;}
  .card h2{font-size:15px; text-transform:uppercase; letter-spacing:0.5px; margin:0 0 4px;}
  .card .path{font-size:11px; color:var(--mid); text-transform:none; margin:0 0 18px;}

  .tile-row{display:grid; grid-template-columns:200px 1fr; gap:24px; align-items:start;}
  .tile-preview{aspect-ratio:1/1; background:var(--grey); border:2px dashed var(--mid); overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .tile-preview img{width:100%; height:100%; object-fit:cover; display:block;}
  .tile-preview .ph{font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--mid); text-align:center; padding:12px;}

  .upload-btn{display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border:2px solid var(--ink); padding:11px 18px; cursor:pointer; margin-right:10px;}
  .upload-btn input{display:none;}
  .tile-msg{font-size:11px; color:var(--mid); text-transform:none; margin-top:10px; min-height:14px;}
  .tile-msg.ok{color:#1e7e34;}
  .tile-msg.err{color:#c0392b;}

  @media (max-width:600px){
    .tile-row{grid-template-columns:1fr; }
    .tile-preview{max-width:200px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <div class="brand"><img src="../img/brand/logo.jpg" alt="Dodge Designed This" /><span class="tag">Admin</span></div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="stock.html">Stock</a>
      <a href="orders.html">Orders</a>
      <a href="settings.html" class="current">Settings</a>
      <a href="../index.html">View Shop</a>
    </nav>
    <button class="signout" id="signout-btn">Sign Out</button>
  </div>
</header>

<main class="wrap">
  <h1>Site Settings</h1>
  <p class="subtitle">The 3 picture-link tiles on the homepage, above the manifesto. Upload a new photo for any of them any time — it updates on the live site as soon as it's uploaded, no code changes needed.</p>

  <div id="tiles"></div>
</main>

<script type="module">
  import { requireSession, signOut } from "../assets/js/admin-auth.js";
  import { supabase } from "../assets/js/supabase-client.js";

  await requireSession();
  document.getElementById("signout-btn").addEventListener("click", signOut);

  const TILES = [
    { key: "category_tile_tees", label: "Tees Tile", fallback: "../img/categories/tees.jpg" },
    { key: "category_tile_hoodies-sweats", label: "Hoodies & Sweats Tile", fallback: "../img/categories/hoodies-sweats.jpg" },
    { key: "category_tile_caps", label: "Caps Tile", fallback: "../img/categories/caps.jpg" },
  ];

  const { data: settings } = await supabase.from("site_settings").select("key, value");
  const settingsMap = Object.fromEntries((settings || []).map((s) => [s.key, s.value]));

  const tilesEl = document.getElementById("tiles");
  tilesEl.innerHTML = TILES.map((t) => tileCardHTML(t)).join("");

  TILES.forEach((t) => {
    const input = document.getElementById(`input-${t.key}`);
    input.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await uploadTile(t, file);
    });
  });

  function tileCardHTML(t) {
    const url = settingsMap[t.key] || t.fallback;
    const isSet = Boolean(settingsMap[t.key]);
    return `
      <div class="card">
        <h2>${t.label}</h2>
        <p class="path">${isSet ? "Custom image set" : "Using the default placeholder — upload a photo to replace it"}</p>
        <div class="tile-row">
          <div class="tile-preview" id="preview-${t.key}">
            <img src="${url}" alt="" onerror="this.closest('.tile-preview').innerHTML='<div class=&quot;ph&quot;>No image yet</div>'" />
          </div>
          <div>
            <label class="upload-btn">
              Upload New Photo
              <input type="file" id="input-${t.key}" accept="image/*" />
            </label>
            <div class="tile-msg" id="msg-${t.key}"></div>
          </div>
        </div>
      </div>`;
  }

  async function uploadTile(t, file) {
    const msg = document.getElementById(`msg-${t.key}`);
    msg.textContent = "Uploading…";
    msg.className = "tile-msg";

    const ext = file.name.split(".").pop();
    const path = `category-tiles/${t.key}-${Date.now()}.${ext}`;

    const { error: upErr } = await supabase.storage.from("site-assets").upload(path, file);
    if (upErr) {
      msg.textContent = `Upload failed: ${upErr.message}`;
      msg.className = "tile-msg err";
      return;
    }

    const { data: pub } = supabase.storage.from("site-assets").getPublicUrl(path);

    const { error: saveErr } = await supabase
      .from("site_settings")
      .upsert({ key: t.key, value: pub.publicUrl, updated_at: new Date().toISOString() }, { onConflict: "key" });

    if (saveErr) {
      msg.textContent = `Saved the photo but couldn't update the setting: ${saveErr.message}`;
      msg.className = "tile-msg err";
      return;
    }

    document.getElementById(`preview-${t.key}`).innerHTML = `<img src="${pub.publicUrl}" alt="" />`;
    msg.textContent = "Live on the homepage now.";
    msg.className = "tile-msg ok";
  }
</script>

</body>
</html>
