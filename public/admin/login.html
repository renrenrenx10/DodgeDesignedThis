<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dodge Designed This — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0a0a0a; --paper:#ffffff; --grey:#eeeeee; --mid:#9a9a9a; }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--ink); color:var(--ink); font-family:'Oswald',sans-serif; letter-spacing:0.3px;}
  body{display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{background:#fff; width:100%; max-width:360px; padding:40px 32px; border:2px solid #000;}
  .brand{text-align:center; margin-bottom:28px;}
  .brand img{height:48px; margin:0 auto 10px;}
  .brand .word{font-weight:700; font-size:14px; letter-spacing:1px; text-transform:uppercase;}
  h1{font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; text-align:center; color:var(--mid); margin:0 0 24px;}
  label{display:block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;}
  input{width:100%; border:2px solid var(--ink); padding:11px 12px; font-family:'Oswald',sans-serif; font-size:14px; margin-bottom:16px; background:#fff;}
  button{width:100%; font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase; padding:13px; border:2px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;}
  button:disabled{opacity:0.5; cursor:default;}
  .err{font-size:12px; color:#c0392b; margin:-6px 0 14px; text-transform:none; letter-spacing:0; min-height:1px;}
  .back{display:block; text-align:center; margin-top:20px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--mid); text-decoration:none;}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="../img/brand/logo.jpg" alt="Dodge Designed This" />
  </div>
  <h1>Admin Login</h1>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <div class="err" id="err"></div>
    <button type="submit" id="submit-btn">Sign In</button>
  </form>
  <a class="back" href="../index.html">&larr; Back to shop</a>
</div>

<script type="module">
  import { supabase } from "../assets/js/supabase-client.js";

  // Already signed in? Skip straight to the dashboard.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = "index.html";

  const form = document.getElementById("login-form");
  const errEl = document.getElementById("err");
  const btn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Signing In…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = "Wrong email or password.";
      btn.disabled = false;
      btn.textContent = "Sign In";
      return;
    }

    window.location.href = "index.html";
  });
</script>

</body>
</html>
